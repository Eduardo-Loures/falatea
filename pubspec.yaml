name: projeto
description: FalaTEA - Aplicativo de Comunicação Aumentativa e Alternativa (CAA) para pessoas com TEA.
version: 1.0.0

environment:
  sdk: ">=3.7.2 <4.0.0"

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  firebase_core: "^3.6.0"
  firebase_auth: "^5.3.1"
  provider: ^6.1.2
  flutter_tts: ^4.2.2
  image_picker: ^1.0.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/
    - assets/imagens_reais/
    - assets/logo/
    - assets/jogos/
    - assets/jogos/emocoes/

  fonts:
    - family: WDXLLubrifontTC-Regular
      fonts:
        - asset: assets/fonts/WDXLLubrifontTC-Regular.ttf